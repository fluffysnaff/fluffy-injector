name: Rust Auto Builder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly

      - name: Build release
        run: cargo build --release

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $meta = cargo metadata --format-version 1 --no-deps --offline | ConvertFrom-Json
          $ver = ($meta.packages | Where-Object { $_.name -eq 'fluffy_injector' }).version
          if (-not $ver) { throw 'cargo metadata has no fluffy_injector version' }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Cargo version $ver"

      - name: Stage portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/fluffy_injector.exe dist/
          Copy-Item LICENSE dist/
          Copy-Item installer/Install-FluffyInjector.ps1 dist/

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile setup
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\fluffy-injector.iss

      - name: Verify artifacts match Cargo version
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $exe = (Get-Item dist/fluffy_injector.exe).VersionInfo.ProductVersion
          if ($exe -notmatch "^$([regex]::Escape($ver))(\.0)*$") {
            throw "exe ProductVersion '$exe' does not match Cargo $ver"
          }
          $setup = "dist/FluffyInjector-$ver-setup.exe"
          if (-not (Test-Path $setup)) { throw "setup missing: $setup" }

      - uses: actions/upload-artifact@v6
        with:
          name: release-build
          path: |
            dist/fluffy_injector.exe
            dist/LICENSE
            dist/Install-FluffyInjector.ps1
            dist/FluffyInjector-*-setup.exe

      - name: Publish GitHub Release if version is new
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $tag = "v$ver"
          $setup = "dist/FluffyInjector-$ver-setup.exe"
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" *> $null
          $tagExists = $LASTEXITCODE -eq 0
          if ($releaseExists -or $tagExists) {
            Write-Host "Tag/release $tag already exists — bump Cargo.toml to publish"
            exit 0
          }
          gh release create $tag --target ${{ github.sha }} --title "Fluffy Injector $tag" --notes "## Fluffy Injector $tag" --generate-notes `
            dist/fluffy_injector.exe `
            $setup
